backend:
  name: github
  repo: Eclipsar1002/Eclipsar1002.github.io
  branch: main
  auth_endpoint: auth

site_url: https://eclipsar1002.github.io
display_url: https://eclipsar1002.github.io
media_folder: public/uploads
public_folder: /uploads
output:
  omit_empty_optional_fields: true
field_defaults:
  richtext:
    editor_components: [image, code-block, table, hr]
slug:
  encoding: unicode
  clean_accents: true

collections:
  - name: blog
    label: 文章
    label_singular: 文章
    folder: src/content/blog
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    nested:
      depth: 10
      subfolders: false
    meta:
      path:
        widget: string
        label: 文件夹
    summary: '{{title}} · {{pubDate}}'
    sortable_fields: [pubDate, title]
    view_groups:
      - label: 标签
        field: tags
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text, required: false }
      - { label: 发布时间, name: pubDate, widget: datetime, date_format: YYYY-MM-DD, time_format: 'HH:mm', format: 'YYYY-MM-DDTHH:mm:ssZ' }
      - { label: 最后修改时间, name: updatedDate, widget: datetime, required: false, format: 'YYYY-MM-DDTHH:mm:ssZ' }
      - { label: 标签, name: tags, widget: list, default: [], required: false }
      - { label: 封面, name: cover, widget: image, required: false, multiple: false }
      - &pdfAttachments
        name: attachments
        label: PDF 附件
        widget: list
        required: false
        default: []
        summary: '{{fields.name}}'
        fields:
          - { label: 显示名称, name: name, widget: string, default: PDF 附件 }
          - { label: PDF 文件, name: file, widget: file, multiple: false, accept: application/pdf, hint: '上传 PDF 后，详情页会显示打开和下载入口。文件将进入公开仓库。' }
      - { label: 正文, name: body, widget: markdown, required: false, hint: '使用原生工具栏插入图片、表格和分割线。保存会提交到 GitHub，浏览器草稿备份不会自动发布。' }

  - name: projects
    label: 项目
    label_singular: 项目
    folder: src/content/projects
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 简介, name: description, widget: text }
      - { label: 日期, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { label: 语言, name: lang, widget: select, options: [{ label: 中文, value: zh }, { label: English, value: en }], default: zh }
      - { label: 角色或类别, name: role, widget: string }
      - { label: 标签, name: tags, widget: list, default: [], required: false }
      - { label: 首页精选, name: featured, widget: boolean, default: false }
      - { label: 项目网址, name: url, widget: string, required: false, hint: '请填写完整 HTTPS 地址；没有时留空。' }
      - { label: 源码仓库, name: repo, widget: string, required: false }
      - *pdfAttachments
      - { label: 正文, name: body, widget: markdown, required: false }

  - name: moments
    label: 个人动态
    label_singular: 动态
    folder: src/content/moments
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: pubDate
    slug: '{{slug}}'
    summary: '{{pubDate}} · {{title}}'
    sortable_fields: [pubDate]
    fields:
      - { label: 发布时间, name: pubDate, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', date_format: YYYY-MM-DD, time_format: 'HH:mm' }
      - { label: 标题（可不填）, name: title, widget: string, required: false }
      - { label: 碎碎念, name: body, widget: markdown, required: false }
      - name: images
        label: 照片
        widget: list
        required: false
        default: []
        summary: '{{fields.alt}}'
        fields:
          - { label: 图片, name: src, widget: image, multiple: false }
          - { label: 图片说明, name: alt, widget: string, required: false }
      - { label: 标签, name: tags, widget: list, required: false, default: [] }

  - name: settings
    label: 网站设置
    files:
      - name: appearance
        label: 背景与音乐
        file: src/config/appearance.json
        format: json
        fields:
          - { label: 背景图片, name: backgroundImage, widget: image, multiple: false }
          - { label: 手机背景图片, name: mobileBackgroundImage, widget: image, multiple: false, hint: '屏幕宽度小于 768px 时使用，电脑背景不受影响。' }
          - { label: 背景亮度, name: brightness, widget: number, value_type: float, min: 0.1, max: 1, step: 0.05, hint: '0.1 最暗，1 最亮。发布后成为所有访客的默认值。' }
          - { label: 背景模糊（像素）, name: backgroundBlur, widget: number, value_type: int, min: 0, max: 30, step: 1 }
          - { label: 默认网易云歌单 ID, name: playlistId, widget: string, pattern: ['^\d+$', '请输入纯数字歌单 ID'] }
